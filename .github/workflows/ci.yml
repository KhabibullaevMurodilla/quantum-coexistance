name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Smoke-run each project scenario (small sizes, just checking for errors)
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          from scenarios.project_a_coexistence_scheduling import main as a
          from scenarios.project_b_price_of_decentralization import main as b
          from scenarios.project_c_learned_interpretable_scheduler import main as c
          a(n_slots=5, n_sessions=8, seed=1)
          b(n_scenarios=2, seed0=1)
          c(train_rounds=3, n_eval_scenarios=1, train_seed=1, eval_seed0=1)
          "
